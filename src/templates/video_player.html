{% extends 'base.html' %}

{% block header %}
{% block title %}Watch Videos!{% endblock %}
{% endblock %}

{% block content %}
<a href="{{ url_for('video_list', expanded=request.args.get('expanded', '')) }}">← Back to video list</a>
<h1>{{ video_name }}</h1>
<video controls width="1400">
  <source
      src="{{ filepath }}"
    type="video/{{ codec }}"
  />
  Unsupported video codec! Download 
  <a href="{{ filepath }}">{{ filepath }}</a>
</video>
{% endblock %}
